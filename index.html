<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Даша Дошик — переходник</title>

    <meta name="description" content="Даша Дошик — свежая ссылка на Telegram">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #252525 0%, #111111 45%, #050505 100%);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
            padding: 40px 25px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            background: rgba(20,20,20,0.85);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .logo {
            width: 95px;
            height: 95px;
            margin: 0 auto 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            background: linear-gradient(135deg, #333333, #111111);
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a8a8a8;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 17px 20px;
            border-radius: 14px;
            background: #229ED9;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 8px 25px rgba(34,158,217,0.25);
        }

        .button:hover {
            transform: translateY(-2px);
            background: #168ac0;
        }

        .button:active {
            transform: scale(0.98);
        }

        .fresh {
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 18px;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(50,205,100,0.08);
            color: #6bd88a;
            font-size: 13px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #45d46a;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            Д
        </div>

        <div class="status">
            <span class="dot"></span>
            Ссылка актуальна
        </div>

        <h1>Даша Дошик</h1>

        <p class="subtitle">
            Свежая ссылка на Telegram-канал
        </p>

        <a
            class="button"
            href="https://t.me/dasha_doshikonlyfs"
            target="_blank"
            rel="noopener noreferrer"
        >
            Перейти в Telegram
        </a>

        <p class="fresh">
            Официальный переходник
        </p>

    </div>

</body>
</html>
